name: Builder.ai
description: >-
  Builder.ai was a London-based AI-assisted software development platform,
  originally founded in 2016 as Engineer.ai by Sachin Dev Duggal, that let
  customers assemble custom web and mobile applications from reusable building
  blocks orchestrated by an AI assistant branded "Natasha." Positioned as a
  no-code/low-code "human-assisted AI" app factory, it raised large rounds from
  investors including Insight Partners, Microsoft, the Qatar Investment
  Authority and SoftBank's DeepCore. The company collapsed into insolvency and
  entered administration in 2025 amid a revenue-restatement controversy, and its
  public web and developer surfaces are no longer operational. This profile is
  retained in the API Evangelist network as a portfolio-lead record; no live
  API, developer portal, or documentation could be verified during enrichment.
